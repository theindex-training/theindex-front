# Checks every pull request: unit tests and the production build, and the E2E journeys.
# Separate from docker-ghcr.yml (build + deploy on push to main), which this file does not touch.
# To block merging on red checks, mark the "test-and-build" and "e2e" checks as required in the
# repository's branch protection settings for main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build

  e2e:
    # User journeys in a real browser (TEST_PLAN.md Part B). The API is mocked inside the tests,
    # so this needs only the Angular dev server, which Playwright starts itself.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E journeys
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
