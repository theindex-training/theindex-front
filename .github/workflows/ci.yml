# Checks every pull request: unit tests and the production build.
# Separate from docker-ghcr.yml (build + deploy on push to main), which this file does not touch.
# To block merging on red checks, mark the "test-and-build" check as required in the
# repository's branch protection settings for main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build
