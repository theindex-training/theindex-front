name: Build and push Docker images (GHCR)

# One pipeline, laid out like theindex-api's:
# - every PR (any base branch): lint, unit tests, production build and the E2E journeys; build/deploy are skipped;
# - push to main (or a v* tag): the same checks, then build and push the image, then deploy.
# The image is never built or deployed unless the lint and both test jobs pass.
# To block merging on red checks, mark "lint", "test-and-build" and "e2e" as required in the
# branch protection settings for main.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]   # optional: push a v1.0.0 tag to publish a versioned image
  pull_request:   # every PR (any base branch): runs lint + tests only; build/deploy are skipped
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # A new push to a PR cancels its older run; runs on main queue instead, so a deploy is never cut off.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (no --fix; any error or warning fails)
        run: npm run lint:check

      - name: Formatting (Prettier, SCSS and JSON included)
        run: npm run format:check

      - name: Type-check E2E journeys
        run: npm run typecheck:e2e

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build

  e2e:
    # User journeys in a real browser (TEST_PLAN.md Part B). The API is mocked inside the tests,
    # so this needs only the Angular dev server, which Playwright starts itself.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E journeys
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-front:
    needs: [lint, test-and-build, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/theindex-front
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (Front)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    # Listed explicitly so a red lint or test job always blocks the deploy.
    needs: [lint, test-and-build, e2e, build-front]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/theindex
            docker compose pull
            docker compose up -d
