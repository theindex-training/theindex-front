<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <title>The Index</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    // Mirrors ThemeService (src/app/services/theme.service.ts), which takes over once Angular boots.
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem('theme');
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
    // Same for the language (Bulgarian unless the user picked English). Mirrors LanguageService.
    (function () {
      var lang = null;
      try {
        lang = localStorage.getItem('lang');
      } catch (e) {}
      document.documentElement.lang = lang === 'en' ? 'en' : 'bg';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700&family=Sofia+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
