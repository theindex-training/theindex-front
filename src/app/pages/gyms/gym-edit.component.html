<section class="page-stack page-narrow">
  <app-page-header
    title="Edit gym"
    subtitle="Update gym location details."
    [back]="{ label: 'Back to gyms', link: '/gyms' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading gym...</p>
  } @else if (errorMessage && !gym) {
    <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
  } @else if (gym) {
    <form class="panel" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="form-grid">
        <label class="form-field">
          <span class="form-field__label">Name</span>
          <input type="text" formControlName="name" />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="form-field__error">Name is required and must be at least 2 characters.</span>
          }
        </label>

        <label class="form-field">
          <span class="form-field__label">Address</span>
          <input type="text" formControlName="address" />
        </label>
      </div>

      @if (errorMessage) {
        <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
      }

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</section>
