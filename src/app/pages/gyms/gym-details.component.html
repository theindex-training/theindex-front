<section class="page-stack page-narrow">
  <app-page-header
    title="Gym details"
    subtitle="Review gym location information and manage availability."
    [back]="{ label: 'Back to gyms', link: '/gyms' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading gym...</p>
  } @else if (errorMessage && !gym) {
    <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
  } @else if (gym) {
    <div class="panel">
      <dl class="detail-list">
        <div>
          <dt>Name</dt>
          <dd>{{ gym.name }}</dd>
        </div>
        <div>
          <dt>Address</dt>
          <dd>{{ formatAddress() }}</dd>
        </div>
        <div>
          <dt>Status</dt>
          <dd>
            <app-status-dot [tone]="gym.isActive ? 'success' : 'neutral'">
              {{ gym.isActive ? 'Active' : 'Inactive' }}
            </app-status-dot>
          </dd>
        </div>
      </dl>

      <div class="form-actions">
        <a class="btn btn--ghost" [routerLink]="['/gyms', gym.id, 'delete']">Deactivate gym</a>
        <a class="btn btn--primary" [routerLink]="['/gyms', gym.id, 'edit']">Edit gym</a>
      </div>
    </div>
  }
</section>
