<section class="page-stack">
  <app-page-header title="My profile" subtitle="Your subscriptions and training attendance." />

  @if (errorMessage && loading) {
    <app-empty-state tone="danger" title="Couldn't load your profile" [message]="errorMessage" />
  } @else {
    <section class="page-stack" aria-labelledby="my-subscriptions-title">
      <div class="section-header">
        <div>
          <h2 class="panel__title" id="my-subscriptions-title">Subscriptions</h2>
          <p class="text-muted section-header__sub">Your current and past subscriptions.</p>
        </div>
        <app-segmented-control
          label="Subscription filter"
          [options]="subscriptionFilterOptions"
          [value]="subscriptionFilter"
          (valueChange)="subscriptionFilter = $event"
        />
      </div>

      <app-trainee-subscriptions-table
        [subscriptions]="filteredSubscriptions"
        [plans]="plans"
        [loading]="subscriptionsLoading"
        [errorMessage]="subscriptionErrorMessage"
        [emptyMessage]="filteredSubscriptionsEmptyMessage"
        [showActionsColumn]="false"
      ></app-trainee-subscriptions-table>
    </section>

    <section class="page-stack" aria-labelledby="my-trainings-title">
      <div class="section-header">
        <div>
          <h2 class="panel__title" id="my-trainings-title">Trainings</h2>
          <p class="text-muted section-header__sub">Your completed trainings.</p>
        </div>
      </div>

      <app-trainee-trainings-table
        [trainings]="trainings"
        [loading]="trainingsLoading"
        [errorMessage]="trainingErrorMessage"
        [emptyMessage]="'No trainings yet.'"
      ></app-trainee-trainings-table>
    </section>
  }
</section>
