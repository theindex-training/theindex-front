<section class="page-stack">
  <app-page-header [title]="'traineeDashboard.title' | transloco" [subtitle]="'traineeDashboard.subtitle' | transloco" />

  @if (errorMessage && loading) {
    <app-empty-state tone="danger" [title]="'traineeDashboard.loadErrorTitle' | transloco" [message]="errorMessage | uiMessage" />
  } @else {
    <section class="page-stack" aria-labelledby="my-subscriptions-title">
      <div class="section-header">
        <div>
          <h2 class="panel__title" id="my-subscriptions-title">{{ 'traineeDashboard.subscriptions' | transloco }}</h2>
          <p class="text-muted section-header__sub">{{ 'traineeDashboard.subscriptionsSub' | transloco }}</p>
        </div>
        <app-segmented-control
          [label]="'traineeDashboard.subscriptionFilter' | transloco"
          [options]="subscriptionFilterOptions"
          [value]="subscriptionFilter"
          (valueChange)="subscriptionFilter = $event"
        />
      </div>

      <app-trainee-subscriptions-table
        [subscriptions]="filteredSubscriptions"
        [plans]="plans"
        [loading]="subscriptionsLoading"
        [errorMessage]="subscriptionErrorMessage"
        [emptyKey]="filteredSubscriptionsEmptyKey"
        [showActionsColumn]="false"
      ></app-trainee-subscriptions-table>
    </section>

    <section class="page-stack" aria-labelledby="my-trainings-title">
      <div class="section-header">
        <div>
          <h2 class="panel__title" id="my-trainings-title">{{ 'traineeDashboard.trainings' | transloco }}</h2>
          <p class="text-muted section-header__sub">{{ 'traineeDashboard.trainingsSub' | transloco }}</p>
        </div>
      </div>

      <app-trainee-trainings-table
        [trainings]="trainings"
        [loading]="trainingsLoading"
        [errorMessage]="trainingErrorMessage"
        emptyKey="traineeDashboard.noTrainings"
      ></app-trainee-trainings-table>
    </section>
  }
</section>
