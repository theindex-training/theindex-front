<section class="page-stack page-narrow">
  <app-page-header
    title="Gym subscription details"
    subtitle="Review gym subscription information and manage availability."
    [back]="{ label: 'Back to gym subscriptions', link: '/gym-subscriptions' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading gym subscription...</p>
  } @else if (errorMessage && !gymSubscription) {
    <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
  } @else if (gymSubscription) {
    <div class="panel">
      <dl class="detail-list">
        <div>
          <dt>Name</dt>
          <dd>{{ gymSubscription.name }}</dd>
        </div>
        <div>
          <dt>Status</dt>
          <dd>
            <app-status-dot [tone]="gymSubscription.isActive ? 'success' : 'neutral'">
              {{ gymSubscription.isActive ? 'Active' : 'Inactive' }}
            </app-status-dot>
          </dd>
        </div>
      </dl>

      <div class="form-actions">
        <a class="btn btn--secondary" [routerLink]="['/gym-subscriptions', gymSubscription.id, 'edit']">
          Edit gym subscription
        </a>
        <a class="btn btn--ghost" [routerLink]="['/gym-subscriptions', gymSubscription.id, 'delete']">
          Deactivate gym subscription
        </a>
      </div>
    </div>
  }
</section>
