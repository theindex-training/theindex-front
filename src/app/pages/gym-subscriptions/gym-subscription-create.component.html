<section class="page-stack">
  <app-page-header
    title="Create gym subscription"
    subtitle="Add a new gym subscription method."
    [back]="{ label: 'Back to gym subscriptions', link: '/gym-subscriptions' }"
  />

  <form class="panel" [formGroup]="form" (ngSubmit)="handleSubmit()">
    <div class="form-grid">
      <div class="form-row">
        <div class="form-field">
          <label class="form-field__label" for="gym-subscription-name">Name</label>
          <input
            id="gym-subscription-name"
            type="text"
            formControlName="name"
            placeholder="Club card"
            aria-describedby="gym-subscription-name-help"
            [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid"
          />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="form-field__error" id="gym-subscription-name-help">Enter a name of 2–120 characters.</span>
          } @else {
            <span class="form-field__hint" id="gym-subscription-name-help">2–120 characters.</span>
          }
        </div>
      </div>
    </div>

    @if (errorMessage) {
      <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
    }

    <div class="form-actions">
      <button class="btn btn--primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Saving...' : 'Create gym subscription' }}
      </button>
    </div>
  </form>
</section>
