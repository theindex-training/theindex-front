<section class="page-stack page-narrow">
  <app-page-header
    title="Edit gym subscription"
    subtitle="Update gym subscription details."
    [back]="{ label: 'Back to gym subscriptions', link: '/gym-subscriptions' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading gym subscription...</p>
  } @else if (errorMessage && !gymSubscription) {
    <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
  } @else if (gymSubscription) {
    <form class="panel" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="form-grid">
        <label class="form-field">
          <span class="form-field__label">Name</span>
          <input type="text" formControlName="name" />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="form-field__error">Name is required and must be between 2 and 120 characters.</span>
          }
        </label>
      </div>

      @if (errorMessage) {
        <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
      }

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</section>
