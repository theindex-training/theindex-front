<section class="page-stack">
  <app-page-header
    title="Edit training time"
    subtitle="Update this attendance training slot."
    [back]="{ label: 'Back to training times', link: '/training-times' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading training time...</p>
  } @else {
    <form class="panel" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="form-grid">
        <div class="form-row">
          <div class="form-field">
            <label class="form-field__label" for="training-time-start-time">Start time</label>
            <input
              id="training-time-start-time"
              type="time"
              formControlName="startTime"
              aria-describedby="training-time-start-time-help"
              [attr.aria-invalid]="form.controls.startTime.touched && form.controls.startTime.invalid"
            />
            @if (form.controls.startTime.touched && form.controls.startTime.invalid) {
              <span class="form-field__error" id="training-time-start-time-help">Start time is required.</span>
            }
          </div>

          <div class="form-field">
            <label class="form-field__label" for="training-time-end-time">End time</label>
            <input
              id="training-time-end-time"
              type="time"
              formControlName="endTime"
              aria-describedby="training-time-end-time-help"
              [attr.aria-invalid]="form.controls.endTime.touched && form.controls.endTime.invalid"
            />
            @if (form.controls.endTime.touched && form.controls.endTime.invalid) {
              <span class="form-field__error" id="training-time-end-time-help">End time is required.</span>
            }
          </div>
        </div>
      </div>

      @if (errorMessage) {
        <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
      }

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</section>
