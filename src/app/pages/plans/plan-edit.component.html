<section class="page-stack page-narrow">
  <app-page-header
    title="Edit plan"
    subtitle="Update plan details or availability."
    [back]="{ label: 'Back to plans', link: '/plans' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading plan...</p>
  } @else if (errorMessage && !plan) {
    <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
  } @else if (plan) {
    <form class="panel" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="form-grid">
        <label class="form-field">
          <span class="form-field__label">Plan type</span>
          <select formControlName="type">
            <option value="PUNCH">Punch (credits)</option>
            <option value="TIME">Time (days)</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-field__label">Title</span>
          <input type="text" formControlName="title" />
          @if (form.controls.title.touched && form.controls.title.invalid) {
            <span class="form-field__error">Title is required.</span>
          }
        </label>

        <label class="form-field">
          <span class="form-field__label">Price (EUR)</span>
          <input type="number" formControlName="price" min="0" step="0.01" />
          @if (form.controls.price.touched && form.controls.price.invalid) {
            <span class="form-field__error">Enter a valid price (up to two decimals).</span>
          }
        </label>

        @if (form.controls.type.value === 'PUNCH') {
          <label class="form-field">
            <span class="form-field__label">Credits</span>
            <input type="number" formControlName="credits" min="1" step="1" />
            @if (form.controls.credits.touched && form.controls.credits.invalid) {
              <span class="form-field__error">Credits must be at least 1.</span>
            }
          </label>
        } @else {
          <label class="form-field">
            <span class="form-field__label">Duration (days)</span>
            <input type="number" formControlName="durationDays" min="1" step="1" />
            @if (form.controls.durationDays.touched && form.controls.durationDays.invalid) {
              <span class="form-field__error">Duration must be at least 1 day.</span>
            }
          </label>
        }

        <label class="form-field form-field--check">
          <input type="checkbox" formControlName="isActive" />
          <span>Active plan</span>
        </label>
      </div>

      @if (errorMessage) {
        <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
      }

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</section>
