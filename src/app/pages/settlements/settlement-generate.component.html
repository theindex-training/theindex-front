<section class="page-stack page-narrow">
  <app-page-header
    title="Generate settlement report"
    subtitle="Create a new settlement using period start and period end dates."
    [back]="{ label: 'Back to settlements', link: '/settlements' }"
  />

  <article class="panel">
    <div class="form-grid">
      <label class="form-field">
        <span class="form-field__label">Period start</span>
        <input type="date" [(ngModel)]="periodStart" />
      </label>

      <label class="form-field">
        <span class="form-field__label">Period end</span>
        <input type="date" [(ngModel)]="periodEnd" />
      </label>
    </div>

    @if (errorMessage) {
      <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
    }

    <div class="form-actions">
      <button class="btn btn--primary" type="button" (click)="generateSettlement()" [disabled]="generating">
        {{ generating ? 'Generating...' : 'Generate report' }}
      </button>
    </div>
  </article>
</section>
