<section class="page-stack page-narrow">
  <app-page-header
    title="Register attendance"
    subtitle="Pick the session, tap everyone who trained, save."
    [back]="{ label: 'Back to attendance', link: '/attendance' }"
  />

  @if (loading) {
    <app-skeleton-list label="Loading trainers, gyms and trainees" [rows]="5" />
  } @else {
    <form class="register" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <fieldset class="panel session">
        <legend class="visually-hidden">Session</legend>
        <label class="form-field session__pick">
          <span class="form-field__label">Trainer</span>
          <select formControlName="trainerId">
            <option value="" disabled>Select trainer</option>
            @for (trainer of trainers; track trainer.id) {
              <option [value]="trainer.id">
                {{ trainer.name }}{{ trainer.nickname ? ' (' + trainer.nickname + ')' : '' }}
              </option>
            }
          </select>
          @if (form.controls.trainerId.touched && form.controls.trainerId.invalid) {
            <span class="form-field__error">Trainer is required.</span>
          }
        </label>

        <label class="form-field session__pick">
          <span class="form-field__label">Gym</span>
          <select formControlName="locationId">
            <option value="" disabled>Select gym location</option>
            @for (gym of gymLocations; track gym.id) {
              <option [value]="gym.id">{{ gym.name }}</option>
            }
          </select>
          @if (form.controls.locationId.touched && form.controls.locationId.invalid) {
            <span class="form-field__error">Gym location is required.</span>
          }
        </label>

        <label class="form-field">
          <span class="form-field__label">Date</span>
          <input type="date" formControlName="trainedDate" />
          @if (form.controls.trainedDate.touched && form.controls.trainedDate.invalid) {
            <span class="form-field__error">Training date is required.</span>
          }
        </label>

        <label class="form-field">
          <span class="form-field__label">Time (optional)</span>
          <select formControlName="trainedTime">
            <option value="">Not specified</option>
            @for (trainingTime of trainingTimes; track trainingTime.id) {
              <option [value]="formatTimeWithoutSeconds(trainingTime.startTime)">
                {{ formatTrainingTimeOption(trainingTime) }}
              </option>
            }
          </select>
        </label>
      </fieldset>

      <fieldset class="who">
        <legend class="who__title">Who trained?</legend>

        <div class="who__tools">
          <div class="who__search">
            <app-icon class="who__search-icon" name="search" />
            <input
              type="search"
              formControlName="traineeSearch"
              placeholder="Search name or nickname"
              aria-label="Search trainees by name or nickname"
              autocomplete="off"
            />
          </div>
          <div class="who__bulk">
            <button class="btn btn--ghost" type="button" (click)="selectFiltered()">Select shown</button>
            <button class="btn btn--ghost" type="button" (click)="clearFiltered()">Clear shown</button>
          </div>
        </div>

        @if (filteredTrainees.length === 0) {
          <p class="notice" role="status">No trainees match this search.</p>
        } @else {
          <ul class="list-card trainees" aria-label="Trainees">
            @for (trainee of filteredTrainees; track trainee.id) {
              <li>
                <label class="trainee" [class.is-selected]="isSelected(trainee.id)">
                  <app-avatar [name]="trainee.name" />
                  <span class="trainee__text">
                    <span class="trainee__name">{{ trainee.name }}</span>
                    <span class="trainee__nickname">{{ trainee.nickname || '—' }}</span>
                  </span>
                  <input
                    class="trainee__check"
                    type="checkbox"
                    [checked]="isSelected(trainee.id)"
                    (change)="toggleTraineeSelection(trainee.id, $any($event.target).checked)"
                  />
                </label>
              </li>
            }
          </ul>
        }
      </fieldset>

      <div class="save-bar">
        @if (errorMessage) {
          <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
        }
        <div class="save-bar__inner">
          <p class="save-bar__count" aria-live="polite">
            <strong class="num">{{ selectedTraineeIds.size }}</strong> selected
          </p>
          <button class="btn btn--primary save-bar__submit" type="submit" [disabled]="submitting">
            {{ submitting ? 'Saving...' : 'Register attendance' }}
          </button>
        </div>
      </div>
    </form>
  }
</section>
