<section class="page-stack">
  <app-page-header [title]="'nav.stats' | transloco" [subtitle]="'stats.subtitle' | transloco" />

  @if (loading) {
    <app-skeleton-list [label]="'stats.loading' | transloco" [rows]="4" />
  } @else if (errorMessage) {
    <app-empty-state tone="danger" [title]="'stats.loadError' | transloco" [message]="errorMessage | uiMessage" />
  } @else if (insights) {
    <div class="stats-grid">
      <app-ranked-list
        [title]="'stats.partners' | transloco"
        [subtitle]="'stats.partnersSub' | transloco"
        countKey="stats.togetherCount"
        [items]="partners"
      />
      <app-ranked-list
        [title]="'stats.weekdays' | transloco"
        [subtitle]="'stats.weekdaysSub' | transloco"
        countKey="stats.trainingsCount"
        [items]="weekdays"
      />
      <app-ranked-list
        [title]="'stats.timeSlots' | transloco"
        [subtitle]="'stats.timeSlotsSub' | transloco"
        countKey="stats.trainingsCount"
        [items]="timeSlots"
      />
      <app-ranked-list
        [title]="'stats.trainers' | transloco"
        [subtitle]="'stats.trainersSub' | transloco"
        countKey="stats.trainingsCount"
        [items]="trainers"
      />
      <app-ranked-list
        [title]="'stats.gyms' | transloco"
        [subtitle]="'stats.gymsSub' | transloco"
        countKey="stats.trainingsCount"
        [items]="gyms"
      />
    </div>
  }
</section>
