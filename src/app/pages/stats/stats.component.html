<section class="page-stack">
  <app-page-header title="Stats" subtitle="Insights based on your training attendance." />

  @if (loading) {
    <app-skeleton-list label="Loading stats" [rows]="4" />
  } @else if (errorMessage) {
    <app-empty-state tone="danger" title="Couldn't load your stats" [message]="errorMessage" />
  } @else if (insights) {
    <div class="stats-grid">
      <app-ranked-list
        title="Top training partners"
        subtitle="People you have trained with most often."
        unit="together"
        [items]="partners"
      />
      <app-ranked-list
        title="Top weekdays"
        subtitle="The weekdays you train on most often."
        unit="trainings"
        [items]="weekdays"
      />
      <app-ranked-list
        title="Top timeslots"
        subtitle="Hours of day with the most training sessions."
        unit="trainings"
        [items]="timeSlots"
      />
      <app-ranked-list
        title="Top trainers"
        subtitle="Trainers you have the most sessions with."
        unit="trainings"
        [items]="trainers"
      />
      <app-ranked-list
        title="Top gyms"
        subtitle="Gyms where you train most often."
        unit="trainings"
        [items]="gyms"
      />
    </div>
  }
</section>
