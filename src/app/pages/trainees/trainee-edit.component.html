<section class="page-stack page-narrow">
  <app-page-header
    title="Edit trainee"
    subtitle="Update trainee profile information."
    [back]="{ label: 'Back to trainees', link: '/trainees' }"
  />

  @if (loading) {
    <p class="notice" role="status">Loading trainee...</p>
  } @else if (errorMessage && !trainee) {
    <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
  } @else if (trainee) {
    <form class="panel" [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="form-grid">
        <label class="form-field">
          <span class="form-field__label">Name</span>
          <input type="text" formControlName="name" />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <span class="form-field__error">Name is required and must be at least 2 characters.</span>
          }
        </label>

        <label class="form-field">
          <span class="form-field__label">Nickname</span>
          <input type="text" formControlName="nickname" />
          @if (form.controls.nickname.touched && form.controls.nickname.invalid) {
            <span class="form-field__error">Nickname must be at least 1 character.</span>
          }
        </label>

        <label class="form-field">
          <span class="form-field__label">Phone</span>
          <input type="text" formControlName="phone" />
          @if (form.controls.phone.touched && form.controls.phone.invalid) {
            <span class="form-field__error">Phone must be at least 1 character.</span>
          }
        </label>


        <label class="form-field">
          <span class="form-field__label">Gym subscription</span>
          <select formControlName="gymSubscriptionId">
            <option [ngValue]="null">No gym subscription</option>
            @for (gymSubscription of gymSubscriptions; track gymSubscription.id) {
              <option [value]="gymSubscription.id">{{ gymSubscription.name }}</option>
            }
          </select>
        </label>

      </div>

      @if (errorMessage) {
        <p class="notice notice--danger" role="alert">{{ errorMessage }}</p>
      }

      <div class="form-actions">
        <button class="btn btn--primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  }
</section>
