<div class="search">
  <label class="visually-hidden" [attr.for]="id">{{ label }}</label>
  <app-icon class="search__icon" name="search" />
  <input
    #input
    class="search__input"
    type="search"
    autocomplete="off"
    [id]="id"
    [value]="value"
    [placeholder]="placeholder || ('common.search' | transloco)"
    (input)="handleInput($event)"
  />
  @if (value) {
    <button class="search__clear" type="button" [attr.aria-label]="'common.clearSearch' | transloco"
      (click)="clear(input)"
    >
      <app-icon name="close" />
    </button>
  }
</div>
