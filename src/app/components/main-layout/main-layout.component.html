<button class="skip-link" type="button" (click)="skipToContent()">
  {{ 'common.skipToContent' | transloco }}
</button>

<div class="shell">
  <app-sidebar
    class="shell__sidebar"
    [mainItems]="navigation.main"
    [manageItems]="navigation.manage"
  />

  <header class="topbar">
    <app-brand />
  </header>

  <main #main class="content" tabindex="-1">
    <router-outlet />
  </main>

  <app-tab-bar
    class="shell__tab-bar"
    [tabs]="navigation.tabs"
    [sheetLabel]="navigation.sheetLabel"
    [sheetActive]="isSheetPageActive()"
    [sheetOpen]="isSheetOpen"
    (openSheet)="openSheet($event)"
  />
</div>

<app-nav-sheet
  [title]="navigation.sheetLabel"
  [mainItems]="navigation.moreMain"
  [manageItems]="navigation.moreManage"
  (openChange)="isSheetOpen = $event"
/>
