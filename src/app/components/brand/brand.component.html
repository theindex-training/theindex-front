<a class="brand" routerLink="/" [attr.aria-label]="'nav.homeLink' | transloco">
  <span class="brand__mark">
    <img
      class="brand__logo"
      src="brand/the-index-logo-red.png"
      alt=""
      width="640"
      height="270"
    />
    @if (holidays.christmas()) {
      <!-- Over Christmas (HolidayService), a Santa hat on the badge's corner. -->
      <svg
        class="brand__hat"
        viewBox="0 0 120 100"
        aria-hidden="true"
        data-testid="brand-santa-hat"
      >
        <path
          class="brand__hat-red"
          d="M22 80C30 44 58 10 96 16c14 2 20 16 10 24-14-10-34 2-40 42Z"
        />
        <path
          class="brand__hat-shade"
          d="M66 82c6-40 26-52 40-42-8-4-22 4-28 40Z"
        />
        <path
          class="brand__hat-fur"
          d="M10 76q30-12 66 0 6 12-4 18-32-10-60 0-10-8-2-18Z"
        />
        <circle class="brand__hat-fur" cx="107" cy="42" r="11" />
      </svg>
    }
    @if (holidays.newYear()) {
      <!-- New Year (Dec 31 – Jan 2): two gold sparkles twinkling on the badge. -->
      @for (sparkle of sparkles; track sparkle) {
        <svg
          class="brand__sparkle"
          [class]="'brand__sparkle--' + sparkle"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M12 0l2 10 10 2-10 2-2 10-2-10L0 12l10-2Z" />
        </svg>
      }
    }
  </span>
</a>
@if (inShell && holidays.survachka()) {
  <!-- Jan 1 – 6: the сурвачка by the logo; a tap opens its New Year wish. -->
  <button
    type="button"
    class="brand__survachka"
    [attr.aria-label]="'holidays.newYear.open' | transloco"
    data-testid="brand-survachka"
    (click)="holidays.openSurvachka()"
  >
    <app-survachka />
  </button>
}
