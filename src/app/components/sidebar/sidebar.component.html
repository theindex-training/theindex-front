<div class="sidebar">
  <div class="sidebar__brand">
    <app-brand />
  </div>

  <nav class="sidebar__nav" [attr.aria-label]="'nav.mainLabel' | transloco">
    @for (group of groups; track group.id) {
      @if (group.label) {
        <h2 class="nav-group-label" [id]="'sidebar-' + group.id">
          {{ group.label | transloco }}
        </h2>
      }
      <ul
        class="nav-list"
        [attr.aria-labelledby]="group.label ? 'sidebar-' + group.id : null"
      >
        @for (item of group.items; track item.route) {
          <li>
            <ng-container
              *ngTemplateOutlet="link; context: { $implicit: item }"
            />
          </li>
        }
      </ul>
    }
  </nav>

  <div class="sidebar__footer">
    <app-theme-switch />
    <app-language-switch />
    <app-holiday-switch />
    <app-user-block />
  </div>
</div>

<ng-template #link let-item>
  <a
    class="nav-link"
    [routerLink]="item.route"
    [class.is-active]="isActive(item)"
    [attr.aria-current]="isActive(item) ? 'page' : null"
  >
    {{ item.label | transloco }}
  </a>
</ng-template>
