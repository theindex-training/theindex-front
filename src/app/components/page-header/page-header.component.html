<header class="page-header">
  <div class="page-header__text">
    @if (back) {
      <a class="page-header__back" [routerLink]="back.link">
        <app-icon name="arrow-left" />
        {{ back.label }}
      </a>
    }
    <h1 class="page-header__title">{{ title }}</h1>
    @if (subtitle) {
      <p class="page-header__subtitle">{{ subtitle }}</p>
    }
  </div>

  @if (action) {
    <a class="page-header__action" [routerLink]="action.link">
      <app-icon name="plus" />
      {{ action.label }}
    </a>
    <a class="fab" [routerLink]="action.link" [attr.aria-label]="action.label">
      <app-icon name="plus" />
    </a>
  }
</header>
