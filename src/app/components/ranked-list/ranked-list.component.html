<section class="panel ranked">
  <div>
    <h2 class="panel__title">{{ title }}</h2>
    @if (subtitle) {
      <p class="ranked__sub">{{ subtitle }}</p>
    }
  </div>

  @if (!items.length) {
    <p class="notice" role="status">{{ emptyMessage }}</p>
  } @else {
    <ol class="ranked__list">
      @for (item of items; track $index) {
        <li class="ranked__item">
          <span class="ranked__rank" aria-hidden="true">{{ $index + 1 }}</span>
          <span class="ranked__body">
            <span class="ranked__row">
              <span class="ranked__label">{{ item.label }}</span>
              <span class="ranked__value num">{{ item.value }}{{ unit ? ' ' + unit : '' }}</span>
            </span>
            <span class="ranked__track" aria-hidden="true">
              <span class="ranked__bar" [style.width.%]="barWidth(item.value)"></span>
            </span>
          </span>
        </li>
      }
    </ol>
  }
</section>
